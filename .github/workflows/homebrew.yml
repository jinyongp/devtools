name: Homebrew

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/homebrew.yml
      - .github/workflows/release.yml
      - .github/homebrew/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homebrew:
    uses: releaseway/homebrew-actions/.github/workflows/check.yml@7e351bd4f3ea1aa0070e4d6556bb5130df2401e6 # v0.5.3
    with:
      tap-repository: jinyongp/homebrew-tap

  validation:
    name: Homebrew validation
    if: ${{ always() }}
    needs: homebrew
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require Formula generation and validation
        env:
          HOMEBREW_RESULT: ${{ needs.homebrew.result }}
        run: test "$HOMEBREW_RESULT" = success
