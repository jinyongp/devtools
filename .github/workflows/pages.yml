name: Publish Installer Page

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to publish. Leave empty for the latest stable release.
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="$DISPATCH_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release view --json tagName --jq '.tagName')
          fi
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          published=$(gh release view "$tag" --json tagName,isDraft,isPrerelease \
            --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName')
          [ "$published" = "$tag" ]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Select installer files
        id: source
        run: |
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo 'files<<INSTALLERS'
            echo install.sh
            if [ -f scripts/install.ps1 ]; then echo install.ps1; fi
            echo INSTALLERS
          } >> "$GITHUB_OUTPUT"

      - name: Verify published installer files
        id: installers
        uses: releaseway/actions/distribute@804562f2eb9d7662810298835f7339bd6f26fcfa # v0.6.0
        with:
          tag: ${{ steps.release.outputs.tag }}
          commit: ${{ steps.source.outputs.commit }}
          files: ${{ steps.source.outputs.files }}
          verification: digest

      - name: Prepare installer site
        env:
          SITE: ${{ steps.installers.outputs.path }}
        run: |
          cmp scripts/install.sh "$SITE/install.sh"
          if [ -f scripts/install.ps1 ]; then
            cmp scripts/install.ps1 "$SITE/install.ps1"
          fi
          sh -n "$SITE/install.sh"
          touch "$SITE/.nojekyll"

      - name: Preserve installer verification report
        if: ${{ always() && steps.installers.outputs.report != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-distribution
          path: ${{ steps.installers.outputs.report }}
          if-no-files-found: error
          retention-days: 30

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.installers.outputs.path }}
      - name: Deploy installer page
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
