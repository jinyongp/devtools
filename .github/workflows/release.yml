name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          printf 'VERSION=%s\n' "${TAG#v}" >> "$GITHUB_ENV"
      - run: just check
      - run: just verify-docker
      - name: Package release targets
        env:
          COMMIT: ${{ github.sha }}
        run: |
          for target_os in darwin linux; do
            for target_arch in amd64 arm64; do
              TARGET_OS="$target_os" TARGET_ARCH="$target_arch" just release "$VERSION"
            done
          done
          cp scripts/install.sh dist/install.sh
          printf '%s\n' "$VERSION" > dist/version.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" dist/* --verify-tag --generate-notes "${flags[@]}"
