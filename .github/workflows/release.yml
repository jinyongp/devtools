name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate tag and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

  macos-check:
    needs: validate-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - run: just check
      - run: just build
      - run: ./bin/devtools project inspect

  release:
    needs: macos-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - name: Set release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printf 'VERSION=%s\n' "${TAG#v}" >> "$GITHUB_ENV"
      - run: just check
      - run: just verify-docker
      - name: Package release targets
        env:
          COMMIT: ${{ github.sha }}
        run: |
          for target_os in darwin linux; do
            for target_arch in amd64 arm64; do
              TARGET_OS="$target_os" TARGET_ARCH="$target_arch" just release "$VERSION"
            done
          done
          cp scripts/install.sh dist/install.sh
          printf '%s\n' "$VERSION" > dist/version.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" dist/* --verify-tag --generate-notes "${flags[@]}"
