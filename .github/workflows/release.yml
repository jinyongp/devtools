name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-latest
    concurrency:
      group: homebrew-devtools
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: Checkout current tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jinyongp/homebrew-tap
          ref: main
          path: tap
          fetch-depth: 0
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Checkout pinned publishing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jinyongp/homebrew-tap
          ref: c0a9c0e0236a97ce6b1c6385bbd69830bfc0d890
          path: tap-tools
          persist-credentials: false
      - name: Generate formula
        id: formula
        uses: ./tap-tools/actions/publish/formula
        with:
          tap-path: tap
          source-path: source
          formula: devtools
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          version: ${{ github.ref_name }}
      - name: Validate formula
        run: |
          validation_root="$(mktemp -d)"
          cp -R tap "$validation_root/homebrew-validation"
          rm -rf "$validation_root/homebrew-validation/.git"
          git -C "$validation_root/homebrew-validation" init --initial-branch=main
          git -C "$validation_root/homebrew-validation" -c user.name=validation -c user.email=validation@example.invalid add -A
          git -C "$validation_root/homebrew-validation" -c user.name=validation -c user.email=validation@example.invalid commit -m 'Validate devtools'
          brew tap jinyongp/validation "$validation_root/homebrew-validation"
          brew audit --strict --formula jinyongp/validation/devtools
          HOMEBREW_NO_INSTALL_FROM_API=1 brew install --build-from-source jinyongp/validation/devtools
          brew test jinyongp/validation/devtools
      - name: Commit formula
        id: commit
        working-directory: tap
        env:
          FORMULA_PATH: ${{ steps.formula.outputs.formula-path }}
          FORMULA: devtools
          VERSION: ${{ steps.formula.outputs.version }}
        run: bash ../tap-tools/.github/workflows/scripts/commit-formula.sh
      - name: Push formula
        if: steps.commit.outputs.changed == 'true'
        working-directory: tap
        run: bash ../tap-tools/.github/workflows/scripts/push-formula.sh

  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate tag and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

  macos-check:
    needs: validate-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - run: just check
      - run: just build
      - run: ./bin/devtools project inspect

  release:
    needs: macos-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - name: Set release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printf 'VERSION=%s\n' "${TAG#v}" >> "$GITHUB_ENV"
      - run: just check
      - run: just verify-docker
      - name: Package release targets
        env:
          COMMIT: ${{ github.sha }}
        run: |
          for target_os in darwin linux; do
            for target_arch in amd64 arm64; do
              TARGET_OS="$target_os" TARGET_ARCH="$target_arch" just release "$VERSION"
            done
          done
          cp scripts/install.sh dist/install.sh
          cp LICENSE dist/LICENSE
          printf '%s\n' "$VERSION" > dist/version.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" dist/* --verify-tag --generate-notes "${flags[@]}"
