name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate tag and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

  ci-macos:
    needs: validate-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - run: just check
      - run: just build
      - run: ./bin/devtools project inspect
      - name: Package macOS Agent Skill reference
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}" OUTPUT_DIR=dist-macos sh scripts/package-skill.sh
          sh scripts/verify-skill-package.sh \
            "dist-macos/devtools-skill_${TAG#v}.tar.gz" \
            "dist-macos/devtools-skill_${TAG#v}.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-agent-skill
          path: dist-macos/
          if-no-files-found: error

  ci-linux:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - run: just check
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: just build
      - run: corepack pnpm test:dashboard:browser
      - run: just verify-docker

  release:
    needs: [ci-macos, ci-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-agent-skill
          path: dist-macos
      - name: Set release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printf 'VERSION=%s\n' "${TAG#v}" >> "$GITHUB_ENV"
      - name: Package release targets
        env:
          COMMIT: ${{ github.sha }}
        run: |
          for target_os in darwin linux; do
            for target_arch in amd64 arm64; do
              TARGET_OS="$target_os" TARGET_ARCH="$target_arch" just release "$VERSION"
            done
          done
          just release-skill "$VERSION"
          sh scripts/verify-skill-package.sh \
            "dist/devtools-skill_${VERSION}.tar.gz" \
            "dist/devtools-skill_${VERSION}.tar.gz.sha256"
          cmp "dist/devtools-skill_${VERSION}.tar.gz" \
            "dist-macos/devtools-skill_${VERSION}.tar.gz"
          cmp "dist/devtools-skill_${VERSION}.tar.gz.sha256" \
            "dist-macos/devtools-skill_${VERSION}.tar.gz.sha256"
          cp scripts/install.sh dist/install.sh
          cp LICENSE dist/LICENSE
          printf '%s\n' "$VERSION" > dist/version.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" dist/* --verify-tag --generate-notes "${flags[@]}"

  homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    uses: jinyongp/homebrew-tap/.github/workflows/publish-formula.yml@5e298c2d25af8f85e1d95b403cbe59c98b9a0b2d
    with:
      formula: devtools
      ref: ${{ github.sha }}
      version: ${{ github.ref_name }}
    secrets:
      deploy_key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
