name: Release
run-name: Release v${{ inputs.version }} at ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      commit:
        description: Full commit SHA to validate; publishing requires main
        required: true
        type: string
      publish:
        description: Create the tag and publish after all checks pass
        required: true
        default: false
        type: boolean
      reuse_validation:
        description: Reuse successful full Windows main-push source checks at this exact SHA
        type: boolean
        default: true
      system_network_smoke:
        description: Run real hosts, trust and low-port checks on disposable runners
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Publication remains globally serialized. Nonpublishing validation candidates
# cannot mutate tags/releases and should not block a newer native investigation.
concurrency:
  group: ${{ inputs.publish && 'release' || format('release-validation-{0}', inputs.commit) }}
  cancel-in-progress: false

jobs:
  validate-release:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.input.outputs.tag }}
      windows-source-reused: ${{ steps.reuse.outputs.windows-source-reused }}
    steps:
      - name: Validate release input
        id: input
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$PUBLISH" = true ]; then [ "$GITHUB_REF" = refs/heads/main ]; fi
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          printf 'tag=v%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Validate main ancestry and tag ownership
        env:
          TAG: ${{ steps.input.outputs.tag }}
          COMMIT: ${{ inputs.commit }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          [ "$(git rev-parse HEAD)" = "$COMMIT" ]
          if [ "$PUBLISH" = true ]; then
            git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main
          fi
          if [ "$PUBLISH" = true ] && git show-ref --verify --quiet "refs/tags/$TAG"; then
            [ "$(git rev-parse "$TAG^{commit}")" = "$COMMIT" ] || {
              echo "$TAG already belongs to another commit; refusing to replace it." >&2
              exit 1
            }
          fi
      - name: Find trusted exact-SHA Windows source validation
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          REUSE_VALIDATION: ${{ inputs.reuse_validation }}
        run: |
          if [ -f scripts/reuse-windows-validation.py ]; then
            python3 -B scripts/reuse-windows-validation.py
          else
            echo 'windows-source-reused=false' >> "$GITHUB_OUTPUT"
          fi

  ci-windows:
    needs: validate-release
    uses: ./.github/workflows/windows-platform.yml
    with:
      commit: ${{ inputs.commit }}
      version: ${{ inputs.version }}
      focus: full
      reuse-source: ${{ needs.validate-release.outputs.windows-source-reused == 'true' }}

  vault-linux:
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Prepare disposable native Secret Service fixture
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus
      - name: Verify Secret Service states and native early-recovery inputs
        env:
          DEVTOOLS_DISPOSABLE_HOST: '1'
        run: python3 -B scripts/check-linux-vault.py
      - name: Verify actual owned-user PAM logout and native key re-unlock
        env:
          DEVTOOLS_DISPOSABLE_HOST: '1'
        run: python3 -B scripts/check-linux-vault-logout.py
      - name: Verify both Unix peer directions with a real different UID
        env:
          DEVTOOLS_DISPOSABLE_HOST: '1'
        run: python3 -B scripts/check-unix-vault-peers.py
      - name: Preserve native Secret Service evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vault-secret-service-linux
          path: |
            vault-secret-service-*.jsonl
            vault-secret-service-*.jsonl.stderr
            vault-secret-service-rewrap-*.json
            vault-secret-service-logout.*
            vault-peers-*
          if-no-files-found: error
          retention-days: 7

  vault-macos:
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          # Cache egress throttling can leave setup waiting until the job limit.
          # Native protection checks must also run with a cold build cache.
          cache: false
      - name: Verify actual native architecture
        run: test "$(go env GOHOSTARCH)" = '${{ matrix.arch }}'
      - name: Verify native Keychain, locked collection and early-recovery inputs
        env:
          DEVTOOLS_DISPOSABLE_HOST: '1'
        run: python3 -B scripts/check-macos-vault.py
      - name: Verify both Unix peer directions with a real different UID
        env:
          DEVTOOLS_DISPOSABLE_HOST: '1'
        run: python3 -B scripts/check-unix-vault-peers.py
      - name: Preserve native Keychain evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vault-keychain-${{ matrix.arch }}
          path: |
            vault-keychain-results.jsonl
            vault-keychain-results.stderr
            vault-keychain-installed.json
            vault-peers-*
          if-no-files-found: error
          retention-days: 7

  ci-unix:
    needs: validate-release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/unix-platform.yml
    with:
      commit: ${{ inputs.commit }}
      measure_automation: true

  ci-macos:
    needs: validate-release
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Bootstrap project CLI
        run: |
          go build -o bin/devtools ./cmd/devtools
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - run: devtools run build:cli
      - run: ./bin/devtools project inspect
      - name: Verify installed CLI reliability journeys and simulated network failures
        run: devtools run test:installed
      - name: Package macOS Agent Skill reference
        env:
          VERSION: ${{ inputs.version }}
        run: |
          OUTPUT_DIR=dist-macos devtools run release:skill "$VERSION"
          sh scripts/verify-skill-package.sh \
            "dist-macos/devtools-skill_${VERSION}.tar.gz" \
            "dist-macos/devtools-skill_${VERSION}.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-agent-skill
          path: dist-macos/
          if-no-files-found: error
          overwrite: true

      - name: Export native encrypted profile fixture
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: python3 -B scripts/check-profile-exchange.py export --binary bin/devtools --origin macos --commit "$SOURCE_COMMIT" --directory profile-exchange-macos
      - name: Verify actual legacy CLI protection barrier
        run: |
          git fetch --no-tags --depth=1 origin 89100eb98888895a450b2ebd403e4e1c9b5f52d2
          python3 -B scripts/check-legacy-vault.py --current bin/devtools --evidence profile-exchange-macos/legacy-vault.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-exchange-macos
          path: profile-exchange-macos/
          if-no-files-found: error
          retention-days: 7

  ci-linux:
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Bootstrap project CLI
        run: |
          go build -o bin/devtools ./cmd/devtools
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - run: devtools run build:cli
      - name: Install verification shells and sandbox launcher
        run: sudo apt-get update && sudo apt-get install -y fish zsh bubblewrap
      - name: Verify installed CLI and simulated network failures
        run: devtools run test:installed

      - name: Export native encrypted profile fixture
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: python3 -B scripts/check-profile-exchange.py export --binary bin/devtools --origin linux --commit "$SOURCE_COMMIT" --directory profile-exchange-linux
      - name: Verify actual legacy CLI protection barrier
        run: |
          git fetch --no-tags --depth=1 origin 89100eb98888895a450b2ebd403e4e1c9b5f52d2
          python3 -B scripts/check-legacy-vault.py --current bin/devtools --evidence profile-exchange-linux/legacy-vault.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-exchange-linux
          path: profile-exchange-linux/
          if-no-files-found: error
          retention-days: 7

  ci-linux-browser:
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Bootstrap project CLI
        run: |
          go build -o bin/devtools ./cmd/devtools
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - run: corepack pnpm install --frozen-lockfile
      - run: devtools run check:skill-discovery
      - run: devtools run check:skill-discovery-public
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: devtools run test:dashboard-browser

  wsl-vault:
    needs: validate-release
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DEVTOOLS_SOURCE_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Build candidate for actual WSL2 execution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          $env:GOOS = 'linux'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-X main.commit=$env:DEVTOOLS_SOURCE_COMMIT -X main.version=0.0.0-wsl-validation" -o bin/devtools-wsl ./cmd/devtools
          if ($LASTEXITCODE -ne 0) { throw 'WSL candidate build failed' }
      - name: Verify actual WSL restart, CLI reliability and PTY recovery
        shell: pwsh
        env:
          DEVTOOLS_DISPOSABLE_HOST: '1'
        run: |
          python -B verify/wsl_vault.py --binary bin/devtools-wsl --commit $env:DEVTOOLS_SOURCE_COMMIT --evidence vault-wsl-restart.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual WSL2 restart validation failed' }
      - name: Preserve actual WSL2 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vault-wsl-restart
          path: vault-wsl-restart.json
          if-no-files-found: error
          retention-days: 7

  system-network:
    needs: validate-release
    if: inputs.system_network_smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
          - platform: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Bootstrap project CLI
        run: go build -o bin/devtools ./cmd/devtools
      - name: Verify disposable system network
        id: system_network
        env:
          DEVTOOLS_DISPOSABLE_HOST: '1'
          EVIDENCE: system-network-${{ matrix.platform }}.json
        run: python3 -B verify/platform_network.py --binary bin/devtools --evidence "$EVIDENCE"
      - name: Preserve system network evidence
        if: always() && steps.system_network.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-network-${{ matrix.platform }}
          path: system-network-${{ matrix.platform }}.json
          if-no-files-found: error

  profile-exchange:
    needs: [ci-macos, ci-linux, ci-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            origin: linux
          - runner: macos-latest
            origin: macos
          - runner: windows-2025
            origin: windows-amd64
          - runner: windows-11-arm
            origin: windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: profile-exchange-*
          path: profile-fixtures
      - name: Import archives from every other native platform
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
          ORIGIN: ${{ matrix.origin }}
        run: python -B scripts/check-profile-exchange.py import --origin "$ORIGIN" --commit "$SOURCE_COMMIT" --directory profile-fixtures --evidence profile-exchange-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: profile-exchange-results-${{ matrix.origin }}
          path: profile-exchange-results.json
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [validate-release, ci-unix, ci-macos, ci-linux, ci-linux-browser, ci-windows, vault-macos, vault-linux, wsl-vault]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Bootstrap project CLI
        run: |
          go build -o bin/devtools ./cmd/devtools
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-agent-skill
          path: dist-macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-product-amd64
          path: native-windows-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-product-arm64
          path: native-windows-arm64
      - name: Package release targets
        run: |
          for target_os in darwin linux; do
            for target_arch in amd64 arm64; do
              TARGET_OS="$target_os" TARGET_ARCH="$target_arch" devtools run release:cli "$VERSION"
            done
          done
          mkdir -p dist
          for target_arch in amd64 arm64; do
            native="native-windows-$target_arch/devtools_${VERSION}_windows_${target_arch}.zip"
            [ -f "$native" ] && [ -f "$native.sha256" ]
            (cd "native-windows-$target_arch" && sha256sum -c "$(basename "$native").sha256")
            cp "$native" "$native.sha256" dist/
          done
          devtools run release:skill "$VERSION"
          sh scripts/verify-skill-package.sh \
            "dist/devtools-skill_${VERSION}.tar.gz" \
            "dist/devtools-skill_${VERSION}.tar.gz.sha256"
          cmp "dist/devtools-skill_${VERSION}.tar.gz" \
            "dist-macos/devtools-skill_${VERSION}.tar.gz"
          cmp "dist/devtools-skill_${VERSION}.tar.gz.sha256" \
            "dist-macos/devtools-skill_${VERSION}.tar.gz.sha256"
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          cp LICENSE dist/LICENSE
          cp internal/notices/NOTICE.txt dist/THIRD_PARTY_NOTICES.txt
          printf '%s\n' "$VERSION" > dist/version.txt
      - name: Verify prepared checksums and binary identity
        run: |
          (cd dist && sha256sum -c ./*.sha256)
          sh -n dist/install.sh
          mkdir -p "$RUNNER_TEMP/release-binary"
          tar -xzf "dist/devtools_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/release-binary"
          "$RUNNER_TEMP/release-binary/devtools" version | jq -e \
            --arg version "$VERSION" --arg commit "$COMMIT" \
            '.ok and .data.version == $version and .data.commit == $commit'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  release:
    needs: [validate-release, package, system-network, profile-exchange]
    if: ${{ inputs.publish && !cancelled() && needs.package.result == 'success' && needs.profile-exchange.result == 'success' && (!inputs.system_network_smoke || needs.system-network.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.validate-release.outputs.tag }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Create or reuse the verified release tag
        run: sh scripts/publish-release-tag.sh
      - name: Publish release
        id: publication
        uses: releaseway/actions@a188ef51e8e5f9947e770260888b7346d9b68ba8 # v0.7.3
        with:
          tag: ${{ needs.validate-release.outputs.tag }}
          commit: ${{ inputs.commit }}
          assets: |
            dist/*
          notes: standard
          prerelease: ${{ contains(inputs.version, '-') && 'true' || 'false' }}
          latest: ${{ contains(inputs.version, '-') && 'false' || 'automatic' }}
      - name: Preserve publication diagnostics
        if: ${{ always() && steps.publication.outputs.diagnostics-path != '' }}
        # A diagnostic upload must not suppress a completed release's follow-up jobs.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-diagnostics
          path: ${{ steps.publication.outputs.diagnostics-path }}
          if-no-files-found: warn
          retention-days: 30

  homebrew:
    needs: [validate-release, release]
    # An optional skipped ancestor must not suppress post-release publication.
    if: ${{ !cancelled() && needs.validate-release.result == 'success' && needs.release.result == 'success' && !contains(inputs.version, '-') }}
    uses: releaseway/homebrew-actions/.github/workflows/publish.yml@7e351bd4f3ea1aa0070e4d6556bb5130df2401e6 # v0.5.3
    with:
      commit: ${{ inputs.commit }}
      version: ${{ needs.validate-release.outputs.tag }}
      tap-repository: jinyongp/homebrew-tap
    secrets:
      tap_deploy_key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  installer-page:
    needs: [validate-release, release]
    if: ${{ !cancelled() && needs.validate-release.result == 'success' && needs.release.result == 'success' && !contains(inputs.version, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Publish the released installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: gh workflow run pages.yml --ref main -f "tag=$TAG"
