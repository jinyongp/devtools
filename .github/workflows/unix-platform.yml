name: Unix validation

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      live_provider:
        type: string
        default: none
      measure_automation:
        description: Collect matched historical automation measurements
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      live_provider:
        description: Explicit public provider; default runs local and LAN validation only
        type: choice
        default: none
        options: [none, cloudflared, tailscale]
      measure_automation:
        description: Also collect descriptive historical performance samples
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/unix-platform.yml
      - .github/workflows/proxy-compat.yml
      - .github/workflows/release.yml
      - internal/**
      - cmd/**
      - scripts/**
      - skills/**
      - perf/**
      - verify/**
      - devtools.toml
      - go.mod
      - go.sum
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  sandbox-query:
    name: ${{ matrix.os }} / read-only query locks
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Linux sandbox launcher
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Validate native read-only locks and policy negative controls
        shell: bash
        run: |
          mkdir -p bin/sandbox-query-evidence
          git rev-parse HEAD > bin/sandbox-query-evidence/source-commit.txt
          go version > bin/sandbox-query-evidence/go-version.txt
          uname -a > bin/sandbox-query-evidence/kernel.txt
          df -h . "$RUNNER_TEMP" > bin/sandbox-query-evidence/filesystem.txt
          python3 -B -m unittest discover -s verify -p test_sandbox_query_fixture.py
          go build -o bin/sandbox-query-lock ./verify/probes/sandbox_query_lock.go
          python3 -B verify/sandbox_query_fixture.py --probe bin/sandbox-query-lock --artifacts bin/sandbox-query-evidence
      - name: Preserve native sandbox evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-query-${{ matrix.os }}-${{ github.run_attempt }}
          path: bin/sandbox-query-evidence/
          if-no-files-found: error
          retention-days: 30

  source:
    name: ${{ matrix.os }} / ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        lane: [static, cli, values, vault, rest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
      # Each lane must save its own compiled race/static cache. Otherwise parallel
      # cold runs compete for the same immutable setup-go cache entry.
      - name: Separate Go caches by validation lane
        run: |
          mkdir -p bin
          printf '%s\n' '${{ matrix.lane }}' > bin/.devtools-ci-cache-scope
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            bin/.devtools-ci-cache-scope
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.lane == 'static'
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: matrix.lane == 'static'
        with:
          enable-cache: false
      - name: Bootstrap project CLI
        if: matrix.lane == 'static'
        run: go build -o bin/devtools ./cmd/devtools
      - name: Static and tooling checks
        if: matrix.lane == 'static'
        run: ./bin/devtools run check:static
      - name: Native Go race tests
        if: matrix.lane != 'static'
        shell: bash
        run: |
          mkdir -p bin/ci-evidence
          date -u '+%Y-%m-%dT%H:%M:%SZ' > bin/ci-evidence/started-at.txt
          git rev-parse HEAD > bin/ci-evidence/source-commit.txt
          go version > bin/ci-evidence/go-version.txt
          go env -json GOOS GOARCH GOVERSION CGO_ENABLED > bin/ci-evidence/go-environment.json
          uname -a > bin/ci-evidence/kernel.txt
          df -h . "$RUNNER_TEMP" > bin/ci-evidence/disk.txt
          printf 'run_id=%s\nattempt=%s\nrunner_os=%s\nrunner_arch=%s\nimage_os=%s\nimage_version=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" "$RUNNER_ARCH" \
            "${ImageOS:-unknown}" "${ImageVersion:-unknown}" \
            > bin/ci-evidence/run.txt
          python3 -B scripts/project.py test-go-lane '${{ matrix.lane }}' 2>&1 | tee bin/ci-evidence/go-tests.log
      - name: Preserve native test evidence
        if: ${{ always() && matrix.lane != 'static' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unix-tests-${{ matrix.os }}-${{ matrix.lane }}-attempt-${{ github.run_attempt }}
          path: bin/ci-evidence/
          if-no-files-found: warn
          retention-days: 30

  handoff:
    name: ${{ matrix.os }} / installed local handoff
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Separate native handoff cache
        run: |
          mkdir -p bin
          printf '%s\n' handoff > bin/.devtools-ci-cache-scope
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            bin/.devtools-ci-cache-scope
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Verify actual native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(go env GOHOSTARCH)" = "$EXPECTED_ARCH"
      - name: Native handoff and engine race contracts
        run: python3 -B scripts/project.py test-go-lane handoff
      - name: Actual different-UID peer boundary
        run: |
          go test -c -o bin/vault-native.test ./internal/vault
          sudo env DEVTOOLS_TEST_NATIVE_PEERS=1 DEVTOOLS_DISPOSABLE_HOST=1 ./bin/vault-native.test -test.run '^TestNativeUnixPeersRejectOtherUID$' -test.v | tee native-unix-peer.log
          python3 -c 'from pathlib import Path; text=Path("native-unix-peer.log").read_text(); assert "--- SKIP" not in text; assert "--- PASS: TestNativeUnixPeersRejectOtherUID " in text; assert "--- PASS: TestNativeUnixPeersRejectOtherUID/runner_transport_rejects_other-user_client " in text'
      - name: Installed guarded mutations, cooperative runner and automatic proxies
        run: python3 -B verify/run.py secret_mutations value_handoff proxy_auto

  automation-performance:
    name: Protected automation measurements
    # Descriptive comparisons have no regression threshold. Keep them in
    # Release and explicit measurements, outside the default PR feedback path.
    if: inputs.measure_automation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f3cb3b15c8f92371c0a14dff6cff29cf341bbd84
          path: mutation-baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7c5811f1830b08922c5c7f2ffbc89307bcb81cfa
          path: handoff-baseline
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: candidate/go.mod
          cache: false
      - name: Matched protected receipt and handoff workloads
        run: python3 -B candidate/perf/automation.py --candidate candidate --mutation-baseline mutation-baseline --handoff-baseline handoff-baseline --output automation-results
      - name: Preserve numeric samples and synthetic benchmark logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protected-automation-measurements
          path: automation-results
          if-no-files-found: error
          retention-days: 30

  proxy-compat:
    name: Proxy compatibility
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/proxy-compat.yml
    with:
      commit: ${{ inputs.commit || github.sha }}
      live_provider: ${{ inputs.live_provider || 'none' }}

  validation:
    name: Unix validation
    if: always()
    needs: [source, handoff, automation-performance, proxy-compat]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every native lane
        env:
          RESULT: ${{ needs.source.result }}
          HANDOFF_RESULT: ${{ needs.handoff.result }}
          PERFORMANCE_RESULT: ${{ needs.automation-performance.result }}
          PERFORMANCE_REQUIRED: ${{ inputs.measure_automation && 'true' || 'false' }}
          PROXY_RESULT: ${{ needs.proxy-compat.result }}
        run: |
          test "$RESULT" = success
          test "$HANDOFF_RESULT" = success
          test "$PROXY_RESULT" = success
          if [ "$PERFORMANCE_REQUIRED" = true ]; then
            test "$PERFORMANCE_RESULT" = success
          else
            test "$PERFORMANCE_RESULT" = skipped
          fi
