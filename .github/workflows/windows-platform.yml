name: Windows platform boundaries

on:
  workflow_dispatch:
    inputs:
      focus:
        description: Focused feedback; full remains the final completion gate
        type: choice
        default: full
        options: [full, network, installer, providers, completion]
  push:
    paths:
      - .github/workflows/windows-platform.yml
      - internal/**
      - cmd/devtools/**
      - scripts/**
      - devtools.toml
      - package.json
      - go.mod
      - go.sum
  pull_request:
    paths:
      - .github/workflows/windows-platform.yml
      - internal/**
      - cmd/devtools/**
      - scripts/**
      - devtools.toml
      - package.json
      - go.mod
      - go.sum

permissions:
  contents: read

jobs:
  private-storage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: amd64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Record focused native runner
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.focus != 'full' }}
        run: |
          $actual = (& go env GOHOSTARCH).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne '${{ matrix.arch }}') { throw 'Native architecture mismatch' }
          $os = Get-CimInstance Win32_OperatingSystem
          $release = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          @{ commit = $env:GITHUB_SHA; os = $os.Caption; version = $os.Version; build = $os.BuildNumber; display_version = $release.DisplayVersion; architecture = $actual; focus = '${{ inputs.focus }}'; powershell = $PSVersionTable.PSVersion.ToString() } | ConvertTo-Json | Set-Content -Encoding utf8 runner.json
      - name: Prepare focused installer package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.focus == 'installer' }}
        run: |
          $env:VERSION = '0.0.0-native-package'
          $env:COMMIT = $env:GITHUB_SHA
          $env:TARGET_OS = 'windows'
          $env:TARGET_ARCH = '${{ matrix.arch }}'
          $env:OUTPUT_DIR = 'dist'
          & python -B scripts/package.py
          if ($LASTEXITCODE -ne 0) { throw 'Native focused ZIP validation failed' }

      - name: Prepare actual package-manager shims
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.focus == 'full' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $shims = Join-Path $env:RUNNER_TEMP 'devtools-package-shims'
          New-Item -ItemType Directory -Force $shims | Out-Null
          & corepack enable --install-directory $shims pnpm
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare pnpm shim' }
          & corepack pnpm --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot activate the pinned pnpm version' }
          $shims | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test native private storage with a separate standard identity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.focus == 'full' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& go env GOHOSTARCH).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne '${{ matrix.arch }}') { throw 'Native architecture mismatch' }
          $os = Get-CimInstance Win32_OperatingSystem
          $release = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          @{ commit = $env:GITHUB_SHA; os = $os.Caption; version = $os.Version; build = $os.BuildNumber; display_version = $release.DisplayVersion; architecture = $actual; elevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator); powershell = $PSVersionTable.PSVersion.ToString() } | ConvertTo-Json | Set-Content -Encoding utf8 runner.json
          $account = 'dvt' + [guid]::NewGuid().ToString('N').Substring(0, 12)
          $password = 'Aa1!' + [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          Write-Output "::add-mask::$password"
          $created = $false
          try {
            New-LocalUser -Name $account -Password (ConvertTo-SecureString $password -AsPlainText -Force) -AccountNeverExpires -UserMayNotChangePassword | Out-Null
            $created = $true
            Add-LocalGroupMember -Group (Get-LocalGroup -SID 'S-1-5-32-545') -Member $account
            $env:DEVTOOLS_TEST_USER = $account
            $env:DEVTOOLS_TEST_PASSWORD = $password
            & go test -json -count=1 ./internal/platformfs ./internal/paths ./internal/location | Tee-Object -FilePath platformfs-results.jsonl
            if ($LASTEXITCODE -ne 0) { throw 'Private storage tests failed' }
            & go vet ./internal/platformfs ./internal/paths ./internal/location
            if ($LASTEXITCODE -ne 0) { throw 'Private storage vet failed' }
          } finally {
            Remove-Item Env:DEVTOOLS_TEST_USER -ErrorAction SilentlyContinue
            Remove-Item Env:DEVTOOLS_TEST_PASSWORD -ErrorAction SilentlyContinue
            if ($created) { Remove-LocalUser -Name $account }
          }
      - name: Test native argv, actual shells and package-manager shims
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.focus == 'full' }}
        env:
          DEVTOOLS_TEST_PACKAGE_SHIMS: '1'
        run: |
          & go test -json -count=1 ./internal/process | Tee-Object -FilePath process-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native process boundary tests failed' }
          & go vet ./internal/process
          if ($LASTEXITCODE -ne 0) { throw 'Native process boundary vet failed' }
          & python -B scripts/check-windows-handle-cleanup.py
          if ($LASTEXITCODE -ne 0) { throw 'Native handle cleanup negative control failed' }
          & go test -json -count=1 -run '^TestWindows' ./internal/execution ./internal/doctor | Tee-Object -FilePath execution-preflight-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native execution preflight tests failed' }

      - name: Test native storage locks and launch leases
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.focus == 'full' }}
        run: |
          & go test -json -count=1 -run 'TestWindows|TestWriterIntentBlocksNewReaders|TestSharedMaintenanceGateAllowsConcurrentReaders' ./internal/maintenance | Tee-Object -FilePath maintenance-lock-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native lock tests failed' }
          & go test -json -count=1 -run '^TestWindows' ./internal/services | Tee-Object -FilePath service-lease-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native launch lease tests failed' }
          & go test -json -count=1 -run '^TestWindows' ./internal/ports | Tee-Object -FilePath port-lock-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native port lock tests failed' }

      - name: Test complete native task, value and profile storage recovery
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.focus == 'full' }}
        run: |
          & go test -json -count=1 -timeout 8m ./internal/tasks ./internal/values ./internal/profilekey | Tee-Object -FilePath storage-recovery-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native storage recovery tests failed' }
          & go test -json -count=1 -timeout 3m ./internal/maintenance -large-storage-test | Tee-Object -FilePath storage-recovery-results.jsonl -Append
          if ($LASTEXITCODE -ne 0) { throw 'Native maintenance recovery tests failed' }
          & go vet ./internal/tasks ./internal/values ./internal/profilekey ./internal/maintenance
          if ($LASTEXITCODE -ne 0) { throw 'Native storage recovery vet failed' }

      - name: Test native backup, transfer, cleanup, logs and complete ports
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.focus == 'full' }}
        run: |
          & go test -json -count=1 -timeout 8m ./internal/backup ./internal/profiletransfer ./internal/cleanup ./internal/archiveproof ./internal/services | Tee-Object -FilePath storage-integration-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native storage integration tests failed' }
          & go test -json -count=1 -timeout 3m ./internal/ports | Tee-Object -FilePath registry-integration-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native registry storage tests failed' }
          & go vet ./internal/backup ./internal/profiletransfer ./internal/cleanup ./internal/archiveproof ./internal/services ./internal/ports
          if ($LASTEXITCODE -ne 0) { throw 'Native storage integration vet failed' }

      - name: Test native listener diagnostics and nonmutating setup
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.focus == 'full' }}
        run: |
          & go test -json -count=1 ./internal/netsetup | Tee-Object -FilePath netsetup-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native setup tests failed' }
          & go test -json -count=1 -run '^TestWindowsListener|^TestWindowsLoopback' ./internal/proxy | Tee-Object -FilePath listener-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native listener diagnostics failed' }
          & go vet ./internal/netsetup ./internal/proxy ./internal/ports
          if ($LASTEXITCODE -ne 0) { throw 'Native listener vet failed' }

      - name: Native detached dashboard and HTTP proxy
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.focus == 'full' }}
        run: |
          & go test -json -count=1 -timeout 3m -run '^TestWindowsDetached' ./internal/dashboard ./internal/proxy | Tee-Object -FilePath detached-daemon-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native detached daemon contract failed' }
          & go test -json -count=1 -timeout 3m ./internal/lifecycle | Tee-Object -FilePath project-lifecycle-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native project lifecycle contract failed' }
          & go test -json -count=5 -timeout 4m -run '^TestWindowsProjectReal' ./internal/lifecycle | Tee-Object -FilePath project-lifecycle-repeat-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Repeated native project lifecycle contract failed' }
      - name: Test native console mode and redirected passphrase input
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.focus == 'full' }}
        run: |
          & go test -json -count=1 -run '^TestWindowsConsole|^TestWindowsPassphrase' ./internal/cli | Tee-Object -FilePath console-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native console tests failed' }
          & go vet ./internal/cli
          if ($LASTEXITCODE -ne 0) { throw 'Native CLI vet failed' }

      - name: Test portable project and release tooling with native packages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.focus == 'full' }}
        run: |
          & python -B --version
          if ($LASTEXITCODE -ne 0) { throw 'Native Python is unavailable' }
          & node --test scripts/project.test.mjs scripts/release.test.mjs | Tee-Object -FilePath project-release-results.tap
          if ($LASTEXITCODE -ne 0) { throw 'Portable project/release tests failed' }
          & python -B scripts/project.py skill-release-check
          if ($LASTEXITCODE -ne 0) { throw 'Portable skill release validation failed' }
          & go test -json -count=1 ./cmd/devtools | Tee-Object -FilePath build-identity-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Build identity tests failed' }
          $env:VERSION = '0.0.0-native-package'
          $env:COMMIT = $env:GITHUB_SHA
          $env:TARGET_OS = 'windows'
          $env:TARGET_ARCH = '${{ matrix.arch }}'
          $env:OUTPUT_DIR = 'dist'
          & python -B scripts/package.py
          if ($LASTEXITCODE -ne 0) { throw 'Native ZIP validation failed' }

      - name: Test constrained native hosts and CurrentUser trust boundaries
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.focus == 'full' || inputs.focus == 'network' }}
        env:
          DEVTOOLS_TEST_SYSTEM_NETWORK: '1'
        run: |
          $account = 'dvt' + [guid]::NewGuid().ToString('N').Substring(0, 12)
          $password = 'Aa1!' + [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          Write-Output "::add-mask::$password"
          $created = $false
          try {
            New-LocalUser -Name $account -Password (ConvertTo-SecureString $password -AsPlainText -Force) -AccountNeverExpires -UserMayNotChangePassword | Out-Null
            $created = $true
            Add-LocalGroupMember -Group (Get-LocalGroup -SID 'S-1-5-32-545') -Member $account
            $env:DEVTOOLS_TEST_USER = $account
            $env:DEVTOOLS_TEST_PASSWORD = $password
            & go test -json -count=1 -timeout 4m -run '^TestWindows|^TestHosts|^TestUnknownMarkedBlock' ./internal/privilege ./internal/hosts ./internal/truststore ./internal/ca ./cmd/devtools | Tee-Object -FilePath windows-network-security-results.jsonl
            if ($LASTEXITCODE -ne 0) { throw 'Native helper/hosts/trust contract failed' }
          } finally {
            Remove-Item Env:DEVTOOLS_TEST_USER -ErrorAction SilentlyContinue
            Remove-Item Env:DEVTOOLS_TEST_PASSWORD -ErrorAction SilentlyContinue
            if ($created) { Remove-LocalUser -Name $account }
          }
          & go test -json -count=1 -timeout 3m -run '^TestLeafChainAndTLS|^TestNetworkListenersTLS|^TestNetworkSecondSocket|^TestTLSRejects|^TestHandlerForwardsWebSocket' ./internal/ca ./internal/proxy | Tee-Object -FilePath windows-network-runtime-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native TLS, HTTP2 and WebSocket contract failed' }
          & go test -json -count=5 -timeout 3m -run '^TestTLSRejectsUnknownSNI' ./internal/proxy | Tee-Object -FilePath windows-tls-repeat-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Repeated native TLS-only start contract failed' }
          & go vet ./internal/privilege ./internal/hosts ./internal/truststore ./internal/winimage
          if ($LASTEXITCODE -ne 0) { throw 'Native network security vet failed' }

      - name: Test native provider pipes, ownership and ARM emulation
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.focus == 'full' || inputs.focus == 'providers' }}
        run: |
          if ('${{ matrix.arch }}' -eq 'arm64') {
            $env:GOARCH = 'amd64'
            try {
              & go test -c -o "$env:RUNNER_TEMP\devtools-provider-amd64.test.exe" ./internal/expose
              if ($LASTEXITCODE -ne 0) { throw 'Cannot build amd64 provider emulation fixture' }
            } finally { Remove-Item Env:GOARCH }
            $env:DEVTOOLS_TEST_X64_PROVIDER = "$env:RUNNER_TEMP\devtools-provider-amd64.test.exe"
          }
          & go test -json -count=1 -timeout 3m ./internal/expose | Tee-Object -FilePath windows-provider-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native provider pipe/lifecycle contract failed' }
          & go vet ./internal/expose
          if ($LASTEXITCODE -ne 0) { throw 'Native provider vet failed' }

      - name: Test native installer recovery and PS5/PS7 running-image updates
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.focus == 'full' || inputs.focus == 'installer' }}
        run: |
          $archive = Get-ChildItem dist -Filter '*.zip' | Select-Object -First 1
          $env:DEVTOOLS_INSTALL_TEST_ZIP = $archive.FullName
          & go test -json -count=1 -timeout 4m ./internal/windowsinstall | Tee-Object -FilePath windows-install-transaction-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native installer transaction tests failed' }
          & go test -json -count=1 -run '^TestHomebrewUpdate|^TestNoninteractiveUpdate' ./internal/cli | Tee-Object -FilePath windows-update-contract-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native updater ownership/error contract failed' }
          & go vet ./internal/windowsinstall
          if ($LASTEXITCODE -ne 0) { throw 'Native installer vet failed' }
          & pwsh -NoProfile -NonInteractive -File scripts/test-windows-install.ps1 -Arch '${{ matrix.arch }}' -Commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Native PowerShell installer/update tests failed' }

      - name: Test public native CLI and PowerShell completion
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.focus == 'full' || inputs.focus == 'completion' }}
        run: |
          & go build -o devtools.exe ./cmd/devtools
          if ($LASTEXITCODE -ne 0) { throw 'Native CLI build failed' }
          & pwsh -NoProfile -NonInteractive -File scripts/test-windows-completion.ps1 -Binary (Resolve-Path .\devtools.exe).Path
          if ($LASTEXITCODE -ne 0) { throw 'Public Windows CLI/completion contract failed' }
          & go test -json -count=1 -run '^TestWindowsPublicPlatform|^TestOutputModeCatalog|^TestVersionReportsMachine|^TestProtocolV7|^TestGeneratedConfig|^TestDiagnostics|^TestDynamicCompletion|^TestRun' ./internal/cli | Tee-Object -FilePath windows-public-contract-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native public CLI contracts failed' }
      - name: Preserve boundary test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-platform-${{ matrix.arch }}
          path: |
            runner.json
            platformfs-results.jsonl
            process-results.jsonl
            handle-cleanup-mutant.log
            execution-preflight-results.jsonl
            maintenance-lock-results.jsonl
            service-lease-results.jsonl
            port-lock-results.jsonl
            console-results.jsonl
            storage-recovery-results.jsonl
            storage-integration-results.jsonl
            registry-integration-results.jsonl
            netsetup-results.jsonl
            listener-results.jsonl
            detached-daemon-results.jsonl
            project-lifecycle-results.jsonl
            project-lifecycle-repeat-results.jsonl
            windows-network-security-results.jsonl
            windows-network-runtime-results.jsonl
            windows-tls-repeat-results.jsonl
            windows-provider-results.jsonl
            windows-completion-results.json
            windows-public-contract-results.jsonl
            windows-update-contract-results.jsonl
            windows-install-transaction-results.jsonl
            windows-install-results.json
            windows-install-diagnostic.txt
            project-release-results.tap
            build-identity-results.jsonl
            dist/*.zip
            dist/*.zip.sha256
            unsupported*.json
          if-no-files-found: warn
          retention-days: 7
