name: Windows platform boundaries

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      version:
        required: true
        type: string
      reuse-source:
        description: Release caller has verified full source and installer compatibility checks at this exact main-push SHA
        type: boolean
        default: false
      focus:
        type: string
        default: full
  workflow_dispatch:
    inputs:
      focus:
        description: Focused feedback; full remains the final completion gate
        type: choice
        default: full
        options: [full, network, installer, powershell, providers, completion, lifecycle, suite, product, race, config, api]
      installer_repetitions:
        description: Repeat the x64-on-ARM64 installer journey to diagnose native crashes (1-20)
        type: number
        default: 1
      powershell_startup_probes:
        description: PowerShell 7 startup and native API controls before installer tests (0-1000)
        type: number
        default: 0
      powershell_stdio_probes:
        description: Exercise the installer's actual redirected subprocess implementation (0-2000)
        type: number
        default: 0
      installer_package_commit:
        description: Optional original 40-character package commit for installer diagnostics
        type: string
        default: ''
  push:
    paths:
      - .github/workflows/windows-platform.yml
      - internal/**
      - cmd/devtools/**
      - scripts/**
      - devtools.toml
      - pnpm-lock.yaml
      - package.json
      - go.mod
      - go.sum
  # Required checks must report a result for every PR, including docs-only PRs.
  pull_request:

permissions:
  contents: read

# Publishing has its own non-cancelling group in release.yml.
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}-${{ inputs.focus || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  native:
    name: Windows ${{ matrix.arch }} / ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
        # Installer compatibility uses the same synthetic versions as the full
        # main push. Reuse that evidence; product builds and installs VERSION again.
        lane: ${{ fromJSON(inputs.reuse-source && '["product"]' || (inputs.focus == 'config' && '["suite-rest"]') || (inputs.focus == 'suite' && '["suite-cli","suite-values","suite-tasks","suite-handoff","suite-runtime","suite-rest"]') || (inputs.focus == 'race' && '["race"]') || (inputs.focus == 'powershell' && '["installer-ps7","installer-x64"]') || (inputs.focus == 'installer' && '["installer-ps5","installer-ps7","installer-x64"]') || ((inputs.focus == 'completion' || inputs.focus == 'product') && '["product"]') || ((inputs.focus == 'network' || inputs.focus == 'providers' || inputs.focus == 'lifecycle' || inputs.focus == 'api') && '["boundaries"]') || '["suite-cli","suite-values","suite-tasks","suite-handoff","suite-runtime","suite-rest","boundaries","product","race","installer-ps5","installer-ps7","installer-x64"]') }}
        include:
          - runner: windows-2025
            arch: amd64
          - runner: windows-11-arm
            arch: arm64
        exclude:
          - runner: windows-11-arm
            lane: race
          - runner: windows-2025
            lane: installer-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DEVTOOLS_SOURCE_COMMIT: ${{ inputs.commit || github.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Verify checkout identity
        run: |
          $actualCommit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualCommit -cne $env:DEVTOOLS_SOURCE_COMMIT) { throw 'Checkout/source commit mismatch' }
      - name: Separate Go caches by validation lane
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          '${{ matrix.lane }}' | Set-Content -Encoding utf8 bin/.devtools-ci-cache-scope
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            bin/.devtools-ci-cache-scope
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ matrix.lane == 'product' || matrix.lane == 'suite-cli' || matrix.lane == 'suite-runtime' || matrix.lane == 'suite-rest' }}
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: matrix.lane == 'product'
        with:
          enable-cache: false
      - name: Record native runner and lane
        run: |
          $actual = (& go env GOHOSTARCH).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne '${{ matrix.arch }}') { throw 'Native architecture mismatch' }
          $os = Get-CimInstance Win32_OperatingSystem
          $release = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          @{ elevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator); commit = $env:DEVTOOLS_SOURCE_COMMIT; workflow_commit = $env:GITHUB_SHA; runner_image = $env:ImageVersion; image_os = $env:ImageOS; os = $os.Caption; version = $os.Version; build = $os.BuildNumber; display_version = $release.DisplayVersion; architecture = $actual; focus = '${{ inputs.focus || 'full' }}'; lane = '${{ matrix.lane }}'; powershell = $PSVersionTable.PSVersion.ToString() } | ConvertTo-Json | Set-Content -Encoding utf8 runner.json
      - name: Standalone native Windows API diagnostics
        if: ${{ matrix.lane == 'boundaries' && inputs.focus == 'api' }}
        run: |
          & go build -o "$env:RUNNER_TEMP/native-probe.exe" verify/probes/native_windows.go
          if ($LASTEXITCODE -ne 0) { throw 'Probe build failed' }
          & "$env:RUNNER_TEMP/native-probe.exe" | Tee-Object -FilePath windows-api-results.json
          if ($LASTEXITCODE -ne 0) { throw 'A native API assertion failed' }
      - name: Prepare native installer package
        if: ${{ matrix.lane == 'installer-ps7' && !inputs.reuse-source && inputs.focus != 'powershell' }}
        run: |
          $env:VERSION = '0.0.0-native-package'
          $env:COMMIT = $env:DEVTOOLS_SOURCE_COMMIT
          $env:TARGET_OS = 'windows'
          $env:TARGET_ARCH = '${{ matrix.arch }}'
          $env:OUTPUT_DIR = 'dist'
          & python -B scripts/package.py
          if ($LASTEXITCODE -ne 0) { throw 'Native installer ZIP validation failed' }

      - name: Prepare actual package-manager shims
        if: ${{ matrix.lane == 'suite-runtime' && (github.event_name != 'workflow_dispatch' || inputs.focus == 'full' || inputs.focus == 'suite') }}
        run: |
          $ErrorActionPreference = 'Stop'
          $shims = Join-Path $env:RUNNER_TEMP 'devtools-package-shims'
          New-Item -ItemType Directory -Force $shims | Out-Null
          & corepack enable --install-directory $shims pnpm
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare pnpm shim' }
          & corepack pnpm --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot activate the pinned pnpm version' }
          $shims | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify handle cleanup negative control
        if: ${{ matrix.lane == 'boundaries' && (github.event_name != 'workflow_dispatch' || inputs.focus == 'full') }}
        run: |
          & python -B scripts/check-windows-handle-cleanup.py
          if ($LASTEXITCODE -ne 0) { throw 'Native handle cleanup negative control failed' }

      - name: Test opt-in large storage recovery
        if: ${{ matrix.lane == 'boundaries' && (github.event_name != 'workflow_dispatch' || inputs.focus == 'full') }}
        run: |
          & go test -json -count=1 -timeout 3m ./internal/maintenance -large-storage-test | Tee-Object -FilePath storage-recovery-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native maintenance recovery tests failed' }

      - name: Repeat native project lifecycle
        if: ${{ matrix.lane == 'boundaries' && (github.event_name != 'workflow_dispatch' || inputs.focus == 'full') }}
        run: |
          & go test -json -count=5 -timeout 4m -run '^TestWindowsProjectReal' ./internal/lifecycle | Tee-Object -FilePath project-lifecycle-repeat-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Repeated native project lifecycle contract failed' }
      - name: Diagnose repeated native project lifecycle
        if: ${{ matrix.lane == 'boundaries' && (github.event_name == 'workflow_dispatch' && inputs.focus == 'lifecycle') }}
        run: |
          & go test -json -count=50 -timeout 4m -run '^TestLegacyProxyStopClosesBackendPool$|^TestManagerExpiresStaleStartingAttemptAndAllowsNewRequest$|^TestManagerResumesPendingStaleRecoveryWithoutRespawn$|^TestManagerStartReportsRecordReadFailureAfterReadinessRPC$' ./internal/proxy | Tee-Object -FilePath windows-legacy-start-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Repeated legacy proxy startup requires investigation' }
          & go test -json -count=20 -timeout 3m -run '^TestWindowsProjectReal' ./internal/lifecycle | Tee-Object -FilePath project-lifecycle-diagnostic-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Repeated native project lifecycle requires investigation' }
          & go test -json -count=3 -timeout 3m -run '^TestWindowsConcurrentRecordPublication' ./internal/services | Tee-Object -FilePath windows-record-publication-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent native record snapshots failed' }
          & go test -json -count=1 -run '^TestWindowsReadWaitsForPublication' ./internal/platformfs | Tee-Object -FilePath windows-publication-read-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Publication sharing reader regression failed' }

      - name: Native configuration publication
        # Full suite-rest already runs both packages and vet with native peers.
        if: ${{ matrix.lane == 'suite-rest' && inputs.focus == 'config' && !inputs.reuse-source }}
        run: |
          & go test -json -count=1 -timeout 2m ./internal/projectfile ./internal/configedit | Tee-Object -FilePath windows-config-publication-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native configuration publication failed' }
          & go vet ./internal/projectfile ./internal/configedit
          if ($LASTEXITCODE -ne 0) { throw 'Native configuration publication vet failed' }

      - name: Verify shared fixture path aliases
        if: matrix.lane == 'suite-rest' && !inputs.reuse-source
        run: |
          & python -B -m unittest discover -s scripts -p test_fixture_paths.py 2>&1 | Tee-Object -FilePath fixture-path-results.log
          if ($LASTEXITCODE -ne 0) { throw 'Shared fixture path alias regression failed' }

      - name: Complete native Go product suite
        if: ${{ startsWith(matrix.lane, 'suite-') && (github.event_name != 'workflow_dispatch' || inputs.focus == 'full' || inputs.focus == 'suite') }}
        env:
          DEVTOOLS_DISPOSABLE_HOST: '1'
          DEVTOOLS_TEST_SYSTEM_NETWORK: '1'
          DEVTOOLS_TEST_PACKAGE_SHIMS: '1'
        run: |
          $account = 'dvt' + [guid]::NewGuid().ToString('N').Substring(0, 12)
          $password = 'Aa1!' + [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          Write-Output "::add-mask::$password"
          $created = $false
          try {
            New-LocalUser -Name $account -Password (ConvertTo-SecureString $password -AsPlainText -Force) -AccountNeverExpires -UserMayNotChangePassword | Out-Null
            $created = $true
            Add-LocalGroupMember -Group (Get-LocalGroup -SID 'S-1-5-32-545') -Member $account
            $env:DEVTOOLS_TEST_USER = $account
            $env:DEVTOOLS_TEST_PASSWORD = $password
            if ('${{ matrix.arch }}' -eq 'arm64' -and '${{ matrix.lane }}' -eq 'suite-runtime') {
              $env:GOARCH = 'amd64'
              try {
                & go test -c -o "$env:RUNNER_TEMP\devtools-provider-suite-amd64.test.exe" ./internal/expose
                if ($LASTEXITCODE -ne 0) { throw 'Cannot build emulation fixture' }
              } finally { Remove-Item Env:GOARCH }
              $env:DEVTOOLS_TEST_X64_PROVIDER = "$env:RUNNER_TEMP\devtools-provider-suite-amd64.test.exe"
            }
            if ('${{ matrix.lane }}' -eq 'suite-rest') {
              & go test -json -count=1 -timeout 60s ./internal/vault -run '^TestNativeWindows(PipePeersRejectOtherSID|SessionEndpointSurvivesBetweenAccepts)$' | Tee-Object -FilePath windows-native-peer-results.jsonl
              if ($LASTEXITCODE -ne 0) { throw 'Actual different-SID pipe preflight failed' }
              $events = @(Get-Content windows-native-peer-results.jsonl | ForEach-Object { $_ | ConvertFrom-Json })
              $passed = @($events | Where-Object Action -eq 'pass' | ForEach-Object { $_.Test })
              foreach ($test in @('TestNativeWindowsSessionEndpointSurvivesBetweenAccepts', 'TestNativeWindowsPipePeersRejectOtherSID', 'TestNativeWindowsPipePeersRejectOtherSID/client_rejects_other-user_server', 'TestNativeWindowsPipePeersRejectOtherSID/server_rejects_other-user_client', 'TestNativeWindowsPipePeersRejectOtherSID/private_pipe_ACL_rejects_other-user_client', 'TestNativeWindowsPipePeersRejectOtherSID/remote_UNC_clients_are_rejected', 'TestNativeWindowsPipePeersRejectOtherSID/runner_transport_client_rejects_other-user_server', 'TestNativeWindowsPipePeersRejectOtherSID/runner_transport_private_ACL_rejects_other-user_client')) {
                if ($passed -notcontains $test) { throw 'Required different-SID native assertion did not actually pass' }
              }
              if (@($events | Where-Object Action -eq 'skip').Count -ne 0) { throw 'Native peer preflight was skipped' }
            }
            $packages = @(& python -B scripts/project.py windows-go-packages '${{ matrix.lane }}')
            if ($LASTEXITCODE -ne 0 -or $packages.Count -eq 0) { throw 'Cannot select native Go suite packages' }
            ConvertTo-Json -InputObject $packages | Set-Content -Encoding utf8 windows-go-packages.json
            # Isolate costly packages on separate runners. Within each shard,
            # avoid CPU contention that starves real-process IPC deadlines.
            & go test -p 1 -json -count=1 -timeout 8m @packages | Tee-Object -FilePath windows-product-suite-results.jsonl
            if ($LASTEXITCODE -ne 0) { throw 'Complete native product suite failed' }
            & go vet @packages
            if ($LASTEXITCODE -ne 0) { throw 'Complete native product vet failed' }
          } finally {
            foreach ($file in @('windows-product-suite-results.jsonl', 'windows-native-peer-results.jsonl')) {
              if (Test-Path -LiteralPath $file) {
                $log = [IO.File]::ReadAllText((Join-Path $PWD $file))
                [IO.File]::WriteAllText((Join-Path $PWD $file), $log.Replace($password, '[redacted disposable credential]'), [Text.UTF8Encoding]::new($false))
              }
            }
            Remove-Item Env:DEVTOOLS_TEST_USER -ErrorAction SilentlyContinue
            Remove-Item Env:DEVTOOLS_TEST_PASSWORD -ErrorAction SilentlyContinue
            if ($created) { Remove-LocalUser -Name $account }
          }

      - name: Test portable project and release tooling with native packages
        if: ${{ matrix.lane == 'product' && !inputs.reuse-source && (github.event_name != 'workflow_dispatch' || inputs.focus == 'full') }}
        run: |
          & python -B --version
          if ($LASTEXITCODE -ne 0) { throw 'Native Python is unavailable' }
          & node --test scripts/project.test.mjs scripts/release.test.mjs | Tee-Object -FilePath project-release-results.tap
          if ($LASTEXITCODE -ne 0) { throw 'Portable project/release tests failed' }
          & python -B scripts/reuse-windows-validation.test.py
          if ($LASTEXITCODE -ne 0) { throw 'Release validation reuse contracts failed' }
          & python -B scripts/project.py skill-release-check
          if ($LASTEXITCODE -ne 0) { throw 'Portable skill release validation failed' }
          $env:VERSION = '0.0.0-native-package'
          $env:COMMIT = $env:DEVTOOLS_SOURCE_COMMIT
          $env:TARGET_OS = 'windows'
          $env:TARGET_ARCH = '${{ matrix.arch }}'
          $env:OUTPUT_DIR = 'dist'
          & python -B scripts/package.py
          if ($LASTEXITCODE -ne 0) { throw 'Native ZIP validation failed' }

      - name: Test constrained native hosts and CurrentUser trust boundaries
        if: ${{ matrix.lane == 'boundaries' && (github.event_name == 'workflow_dispatch' && inputs.focus == 'network') }}
        env:
          DEVTOOLS_TEST_SYSTEM_NETWORK: '1'
        run: |
          $account = 'dvt' + [guid]::NewGuid().ToString('N').Substring(0, 12)
          $password = 'Aa1!' + [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          Write-Output "::add-mask::$password"
          $created = $false
          try {
            New-LocalUser -Name $account -Password (ConvertTo-SecureString $password -AsPlainText -Force) -AccountNeverExpires -UserMayNotChangePassword | Out-Null
            $created = $true
            Add-LocalGroupMember -Group (Get-LocalGroup -SID 'S-1-5-32-545') -Member $account
            $env:DEVTOOLS_TEST_USER = $account
            $env:DEVTOOLS_TEST_PASSWORD = $password
            & go test -json -count=1 -timeout 4m -run '^TestWindows|^TestHosts|^TestUnknownMarkedBlock' ./internal/privilege ./internal/hosts ./internal/truststore ./internal/ca ./cmd/devtools | Tee-Object -FilePath windows-network-security-results.jsonl
            if ($LASTEXITCODE -ne 0) { throw 'Native helper/hosts/trust contract failed' }
          } finally {
            Remove-Item Env:DEVTOOLS_TEST_USER -ErrorAction SilentlyContinue
            Remove-Item Env:DEVTOOLS_TEST_PASSWORD -ErrorAction SilentlyContinue
            if ($created) { Remove-LocalUser -Name $account }
          }
          & go test -json -count=1 -timeout 3m -run '^TestLeafChainAndTLS|^TestNetworkListenersTLS|^TestNetworkSecondSocket|^TestTLSRejects|^TestHandlerForwardsWebSocket' ./internal/ca ./internal/proxy | Tee-Object -FilePath windows-network-runtime-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native TLS, HTTP2 and WebSocket contract failed' }
          & go test -json -count=5 -timeout 3m -run '^TestTLSRejectsUnknownSNI' ./internal/proxy | Tee-Object -FilePath windows-tls-repeat-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Repeated native TLS-only start contract failed' }
          & go vet ./internal/privilege ./internal/hosts ./internal/truststore ./internal/winimage
          if ($LASTEXITCODE -ne 0) { throw 'Native network security vet failed' }

      - name: Repeat native TLS-only startup
        if: ${{ matrix.lane == 'boundaries' && (github.event_name != 'workflow_dispatch' || inputs.focus == 'full') }}
        run: |
          & go test -json -count=5 -timeout 3m -run '^TestTLSRejectsUnknownSNI' ./internal/proxy | Tee-Object -FilePath windows-tls-repeat-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Repeated native TLS-only start contract failed' }

      - name: Test native provider pipes, ownership and ARM emulation
        if: ${{ matrix.lane == 'boundaries' && (github.event_name == 'workflow_dispatch' && inputs.focus == 'providers') }}
        run: |
          if ('${{ matrix.arch }}' -eq 'arm64') {
            $env:GOARCH = 'amd64'
            try {
              & go test -c -o "$env:RUNNER_TEMP\devtools-provider-amd64.test.exe" ./internal/expose
              if ($LASTEXITCODE -ne 0) { throw 'Cannot build amd64 provider emulation fixture' }
            } finally { Remove-Item Env:GOARCH }
            $env:DEVTOOLS_TEST_X64_PROVIDER = "$env:RUNNER_TEMP\devtools-provider-amd64.test.exe"
          }
          & go test -json -count=1 -timeout 3m ./internal/expose | Tee-Object -FilePath windows-provider-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native provider pipe/lifecycle contract failed' }
          & go vet ./internal/expose
          if ($LASTEXITCODE -ne 0) { throw 'Native provider vet failed' }

      - name: Test native installer recovery
        if: ${{ matrix.lane == 'installer-ps7' && !inputs.reuse-source && inputs.focus != 'powershell' }}
        run: |
          $archive = Get-ChildItem dist -Filter '*.zip' | Select-Object -First 1
          $env:DEVTOOLS_INSTALL_TEST_ZIP = $archive.FullName
          & go test -json -count=1 -timeout 4m ./internal/windowsinstall | Tee-Object -FilePath windows-install-transaction-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native installer transaction tests failed' }
          & go test -json -count=1 -run '^TestHomebrewUpdate|^TestNoninteractiveUpdate' ./internal/cli | Tee-Object -FilePath windows-update-contract-results.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native updater ownership/error contract failed' }
          & go vet ./internal/windowsinstall
          if ($LASTEXITCODE -ne 0) { throw 'Native installer vet failed' }
      - name: Test selected native PowerShell installer and running-image updates
        if: ${{ startsWith(matrix.lane, 'installer-') }}
        env:
          INSTALLER_PACKAGE_COMMIT: ${{ inputs.installer_package_commit }}
          INSTALLER_REPETITIONS: ${{ inputs.installer_repetitions }}
        run: |
          $dumpFolder = Join-Path $PWD 'windows-install-crashes'
          New-Item -ItemType Directory -Force $dumpFolder | Out-Null
          $dumpKey = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\pwsh.exe'
          New-Item -Path $dumpKey -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpFolder -Value $dumpFolder -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpCount -Value 2 -PropertyType DWord -Force | Out-Null
          $engine = '${{ matrix.lane }}'.Substring(10)
          $repeat = if ($engine -eq 'x64' -and $env:INSTALLER_REPETITIONS) { [int]$env:INSTALLER_REPETITIONS } else { 1 }
          $startupProbes = if ($engine -in @('ps7', 'x64')) { [int]'${{ inputs.powershell_startup_probes || 0 }}' } else { 0 }
          $stdioProbes = if ($engine -in @('ps7', 'x64')) { [int]'${{ inputs.powershell_stdio_probes || 0 }}' } else { 0 }
          $packageArguments = @()
          if ($repeat -ne 1) { $packageArguments += @('-Repeat', [string]$repeat) }
          if ($startupProbes -ne 0) { $packageArguments += @('-StartupProbes', [string]$startupProbes) }
          if ($stdioProbes -ne 0) { $packageArguments += @('-StdioProbes', [string]$stdioProbes) }
          if ($env:INSTALLER_PACKAGE_COMMIT) {
            if ('${{ inputs.focus }}' -notin @('installer', 'powershell')) { throw 'An original package is only allowed in focused installer diagnostics' }
            $packageArguments += @('-PackageCommit', $env:INSTALLER_PACKAGE_COMMIT)
          }
          & pwsh -NoProfile -NonInteractive -File scripts/test-windows-install.ps1 -Arch '${{ matrix.arch }}' -Commit $env:DEVTOOLS_SOURCE_COMMIT -Engine $engine @packageArguments
          if ($LASTEXITCODE -ne 0) { throw 'Native PowerShell installer/update tests failed' }

      - name: Native amd64 race detector
        if: ${{ matrix.lane == 'race' && (matrix.arch == 'amd64' && (github.event_name != 'workflow_dispatch' || inputs.focus == 'full' || inputs.focus == 'race')) }}
        run: |
          $compiler = (Get-Command gcc.exe -ErrorAction Stop).Source
          $library = (& $compiler --print-file-name libsynchronization.a).Trim()
          if ($LASTEXITCODE -ne 0 -or $library -eq 'libsynchronization.a' -or -not (Test-Path -LiteralPath $library)) { throw 'A compatible mingw-w64 race toolchain is required' }
          $target = (& $compiler -dumpmachine).Trim()
          if ($LASTEXITCODE -ne 0 -or $target -notmatch '^x86_64-.*mingw32$') { throw 'Race compiler architecture mismatch' }
          @{ architecture = 'amd64'; compiler = $compiler; target = $target; synchronization_library = $library; arm64_race = 'not_supported'; gorace = 'halt_on_error=1 atexit_sleep_ms=0' } | ConvertTo-Json | Set-Content -Encoding utf8 windows-race-toolchain.json
          $env:CC = $compiler; $env:CGO_ENABLED = '1'; $env:GORACE = 'halt_on_error=1 atexit_sleep_ms=0'
          try {
            & go test -race -json -count=1 -timeout 8m ./internal/tasks ./internal/values ./internal/valuehandoff ./internal/runnerengine ./internal/services ./internal/lifecycle ./internal/profiles ./internal/diagnostics | Tee-Object -FilePath windows-race-results.jsonl
            if ($LASTEXITCODE -ne 0) { throw 'Native amd64 race contract failed' }
          } finally { Remove-Item Env:CC; Remove-Item Env:CGO_ENABLED; Remove-Item Env:GORACE }

      - name: Verify installed candidate and actual Chromium dashboard
        if: ${{ matrix.lane == 'product' && (github.event_name != 'workflow_dispatch' || inputs.focus == 'full' || inputs.focus == 'product') }}
        env:
          DEVTOOLS_DISPOSABLE_HOST: '1'
        run: |
          $env:VERSION = '${{ inputs.version || '0.0.0-windows-candidate' }}'
          $env:COMMIT = $env:DEVTOOLS_SOURCE_COMMIT
          $env:TARGET_OS = 'windows'; $env:TARGET_ARCH = '${{ matrix.arch }}'; $env:OUTPUT_DIR = 'dist-product'
          & python -B scripts/package.py
          if ($LASTEXITCODE -ne 0) { throw 'Native product package failed' }
          $archive = Get-ChildItem dist-product -Filter '*.zip' | Select-Object -First 1
          $expanded = Join-Path $env:RUNNER_TEMP ('devtools-product-' + [guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $expanded
          $env:DEVTOOLS_TEST_CLI_BINARY = Join-Path $expanded 'devtools.exe'
          $env:DEVTOOLS_TEST_CLI_COMMIT = $env:DEVTOOLS_SOURCE_COMMIT
          $identity = (& $env:DEVTOOLS_TEST_CLI_BINARY version | ConvertFrom-Json).data
          if ($LASTEXITCODE -ne 0 -or $identity.commit -cne $env:DEVTOOLS_SOURCE_COMMIT -or $identity.version -cne $env:VERSION) { throw 'Packaged runtime identity mismatch' }
          @{ commit = $identity.commit; version = $identity.version; architecture = '${{ matrix.arch }}'; zip = $archive.Name; zip_sha256 = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); exe_sha256 = (Get-FileHash -LiteralPath $env:DEVTOOLS_TEST_CLI_BINARY -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content -Encoding utf8 windows-product-identity.json
          & python -B scripts/test-windows-product.py --release-dir dist-product --version $env:VERSION --commit $env:DEVTOOLS_SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Installed candidate journey failed' }
          & git fetch --no-tags --depth=1 origin 89100eb98888895a450b2ebd403e4e1c9b5f52d2
          if ($LASTEXITCODE -ne 0) { throw 'Pinned compatibility baseline is unavailable' }
          & python -B scripts/check-legacy-vault.py --current $env:DEVTOOLS_TEST_CLI_BINARY --evidence windows-legacy-vault.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual legacy CLI protection barrier failed' }
          & corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Browser dependencies failed' }
          & corepack pnpm exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Native runner Chromium is unavailable' }
          $env:DEVTOOLS_BROWSER_EXECUTABLE = (& node --input-type=module -e 'import {chromium} from "@playwright/test"; process.stdout.write(chromium.executablePath())').Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $env:DEVTOOLS_BROWSER_EXECUTABLE)) { throw 'Cannot locate actual Chromium image' }
          & corepack pnpm exec playwright test scripts/dashboard-browser.spec.mjs --workers=1 --reporter=line --trace=retain-on-failure --output=windows-browser-results | Tee-Object -FilePath windows-browser.log
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native dashboard browser journey failed' }

      - name: Test public native CLI and PowerShell completion
        if: ${{ matrix.lane == 'product' && (github.event_name != 'workflow_dispatch' || inputs.focus == 'full' || inputs.focus == 'completion') }}
        run: |
          & go build -o devtools.exe ./cmd/devtools
          if ($LASTEXITCODE -ne 0) { throw 'Native CLI build failed' }
          & pwsh -NoProfile -NonInteractive -File scripts/test-windows-completion.ps1 -Binary (Resolve-Path .\devtools.exe).Path
          if ($LASTEXITCODE -ne 0) { throw 'Public Windows CLI/completion contract failed' }
      - name: Preserve verified native product package
        if: ${{ matrix.lane == 'product' && (success() && (github.event_name != 'workflow_dispatch' || inputs.focus == 'full')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-product-${{ matrix.arch }}
          path: dist-product/*
          if-no-files-found: error
          retention-days: 7

      - name: Export native encrypted profile fixture
        if: ${{ matrix.lane == 'product' && (github.event_name != 'workflow_dispatch' || inputs.focus == 'full') }}
        run: |
          & python -B scripts/check-profile-exchange.py export --binary devtools.exe --origin windows-${{ matrix.arch }} --commit $env:DEVTOOLS_SOURCE_COMMIT --directory profile-exchange-windows-${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { throw 'Native profile fixture export failed' }
      - name: Preserve native profile fixture and CLI
        if: ${{ matrix.lane == 'product' && (github.event_name != 'workflow_dispatch' || inputs.focus == 'full') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-exchange-windows-${{ matrix.arch }}
          path: profile-exchange-windows-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

      - name: Preserve boundary test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-platform-${{ matrix.arch }}-${{ matrix.lane }}
          path: |
            runner.json
            windows-api-results.json
            windows-race-toolchain.json
            windows-race-results.jsonl
            windows-product-identity.json
            windows-installed-product-results.json
            windows-legacy-vault.json
            windows-browser-results.json
            windows-browser.log
            windows-browser-results/
            handle-cleanup-mutant.log
            storage-recovery-results.jsonl
            windows-record-publication-results.jsonl
            windows-publication-read-results.jsonl
            windows-product-suite-results.jsonl
            windows-go-packages.json
            windows-config-publication-results.jsonl
            fixture-path-results.log
            windows-native-peer-results.jsonl
            project-lifecycle-repeat-results.jsonl
            project-lifecycle-diagnostic-results.jsonl
            windows-legacy-start-results.jsonl
            windows-network-security-results.jsonl
            windows-network-runtime-results.jsonl
            windows-tls-repeat-results.jsonl
            windows-provider-results.jsonl
            windows-completion-results.json
            windows-update-contract-results.jsonl
            windows-install-transaction-results.jsonl
            windows-install-results.json
            windows-install-diagnostic.txt
            windows-install-context.json
            windows-install-stdout.txt
            windows-install-events.json
            windows-install-event-error.txt
            windows-install-emulated-runtime.json
            windows-install-package-source.json
            windows-install-startup-cache.bin
            windows-install-cache-error.txt
            windows-powershell-startup-results.json
            windows-powershell-stdio-results.json
            windows-install-crashes/
            project-release-results.tap
            dist/*.zip
            dist/*.zip.sha256
            unsupported*.json
          if-no-files-found: warn
          retention-days: 7

  validation:
    # Focused diagnostics and reused release lanes cannot satisfy the full PR gate.
    name: ${{ (inputs.focus == '' || inputs.focus == 'full') && !inputs.reuse-source && 'Windows validation' || 'Windows focused validation' }}
    if: ${{ always() }}
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all native Windows lanes
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$NATIVE_RESULT" = success
