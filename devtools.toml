profile = "devtools"

[commands."build:cli"]
exec = ["./scripts/project", "build-cli"]
inject = false

[commands."dev:dashboard"]
exec = ["./scripts/project", "dashboard"]
inject = false

[commands."fmt:go"]
exec = ["gofmt", "-w", "cmd", "internal", "scripts", "skills", "perf"]
inject = false

[commands."check:all"]
exec = ["./scripts/project", "check"]
inject = false

[commands."check:static"]
exec = ["./scripts/project", "check-static"]
inject = false

[commands."test:go-lane"]
exec = ["./scripts/project", "test-go-lane"]
inject = false

[commands."check:dashboard"]
exec = ["./scripts/project", "dashboard-check"]
inject = false

[commands."test:dashboard-browser"]
exec = ["corepack", "pnpm", "exec", "playwright", "test", "scripts/dashboard-browser.spec.mjs", "--workers=1", "--reporter=line"]
inject = false

[commands."check:skill-discovery"]
exec = ["corepack", "pnpm", "exec", "skills", "add", ".", "--list"]
inject = false

[commands."check:skill-discovery-public"]
exec = ["corepack", "pnpm", "exec", "skills", "add", "jinyongp/devtools", "--list"]
inject = false

[commands."check:release"]
exec = ["./scripts/project", "release-check"]
inject = false

[commands."check:project"]
exec = ["./scripts/project", "project-check"]
inject = false

[commands."check:installer"]
exec = ["./scripts/project", "installer-check"]
inject = false

[commands."check:skill"]
exec = ["./scripts/project", "skill-check"]
inject = false

[commands."check:skill-release"]
exec = ["./scripts/project", "skill-release-check"]
inject = false

[commands."check:perf"]
exec = ["./scripts/project", "python", "-B", "-m", "unittest", "discover", "-s", "perf", "-p", "test_run.py"]
inject = false

[commands."test:go"]
exec = ["go", "test", "./..."]
inject = false

[commands."lint:go"]
exec = ["go", "vet", "./..."]
inject = false

[commands."clean:build"]
exec = ["./scripts/project", "clean"]
inject = false

[commands."release:cli"]
exec = ["./scripts/project", "package-cli"]
inject = false

[commands."release:plan"]
exec = ["node", "scripts/release.mjs"]
inject = false

[commands."release:publish"]
exec = ["node", "scripts/release.mjs", "--publish"]
inject = false

[commands."release:skill"]
exec = ["./scripts/project", "package-skill"]
inject = false

[commands."test:installed"]
exec = ["./scripts/project", "python", "-B", "verify/run.py"]
inject = false

[commands."perf:all"]
exec = ["./scripts/project", "python", "-B", "perf/run.py"]
inject = false

[commands."perf:go"]
exec = ["./scripts/project", "python", "-B", "perf/run.py", "--go", "--runs", "3"]
inject = false
